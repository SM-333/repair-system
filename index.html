<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repair Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="app.css">
  <script src="lib.js"></script>
</head>

<body>

<div class="topbar">
  <span class="brand">REPAIR SHOP</span>
  <button class="secondary" onclick="signOut()">Sign out</button>
</div>

<div class="container">

  <h2>What do you want to do?</h2>

  <div class="home-actions">
    <button onclick="location.href='create.html'">+ Create Repair</button>
    <button class="secondary" onclick="location.href='finish.html'">Finish Repair</button>
  </div>

  <p class="muted" style="text-align:center;">
    Signed in as <span id="who">shop</span>
  </p>

</div>

<script>
if (!requireSignIn()) {
  // requireSignIn() already redirected to login.html.
  throw new Error("not signed in");
}

document.getElementById("who").textContent = currentUser();
</script>

</body>
</html>
